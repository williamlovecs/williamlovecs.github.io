name: LingoTech ABC public verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/lingotech-abc-public-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify public bytes match tested v4.1
        run: |
          python - <<'PY'
          import urllib.request,hashlib,json,time
          expected='c6c29e63fc443e63631072b39b76cf736c275d7fd7512ae1ad0ff9442947645c'
          urls=['https://williamlovecs.github.io/lingotech/','https://williamlovecs.github.io/lingotech-photo-booth/']
          results=[]
          for url in urls:
              item={'url':url,'verified':False}
              for attempt in range(15):
                  try:
                      request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'LingoTech-ABC-release-check'})
                      with urllib.request.urlopen(request,timeout=10) as response:
                          content=response.read();item.update(status=response.status,bytes=len(content),sha256=hashlib.sha256(content).hexdigest())
                      item['verified']=item['sha256']==expected
                      if item['verified']:break
                  except Exception as e:item['error']=str(e)[:180]
                  time.sleep(4)
              results.append(item)
          open('abc-public-verification.json','w').write(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          assert all(item['verified'] for item in results),results
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lingotech-abc-public-verification
          retention-days: 7
          path: abc-public-verification.json
