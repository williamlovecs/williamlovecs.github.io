name: LingoTech v4.5 unified-entry regression
on:
  push:
    branches: ['fix/lingotech-v45-unified-20261030']
    paths:
      - 'lingotech/release45/**'
      - '_archive/lingotech-photo-booth/v4.4-20261030/**'
      - '.github/workflows/lingotech-v45-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lingotech-v45-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and QR test dependencies
        run: |
          pip install playwright==1.56.0 pillow==11.3.0 opencv-python-headless==4.12.0.88
          python -m playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Build v4.5 from immutable v4.4 archive
        run: python lingotech/release45/build.py
      - name: Chromium and WebKit user flows, privacy and genuine QR checks
        run: python lingotech/release45/test_release.py
      - name: Existing complete editor regression with explicit Chinese test locale
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lingotech/release43/test_release.py').resolve()
          s=p.read_text().replace("new_context(viewport=", "new_context(locale='zh-CN',viewport=")
          exec(compile(s,str(p),'exec'),{'__file__':str(p),'__name__':'__main__'})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lingotech-v45-verified-release
          retention-days: 14
          path: |
            lingotech/release45/test-output/
            lingotech/release43/test-output/
            lingotech/index.html
            lingotech/release.json
            lingotech-photo-booth/index.html
      - name: Commit tested assets to candidate branch only
        if: success() && github.ref == 'refs/heads/fix/lingotech-v45-unified-20261030'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lingotech/index.html lingotech-photo-booth/index.html lingotech/release.json
          git diff --cached --quiet || git commit -m 'Build verified v4.5 canonical Photo Booth and legacy redirect'
          git push origin HEAD:fix/lingotech-v45-unified-20261030
